name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # A tag from a red commit must not ship binaries.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # This key matches the CI job on ubuntu-latest, so a tag restores the CI cache.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu-latest
      - name: Check that the release notes exist
        shell: bash
        run: |
          set -euo pipefail
          notes="doc/releases/${GITHUB_REF_NAME}.md"
          [[ -f "$notes" ]] || {
            echo "Missing release notes: $notes"
            exit 1
          }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: crux
            asset: crux-aarch64-apple-darwin
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: crux
            asset: crux-x86_64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            binary: crux
            asset: crux-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            binary: crux
            asset: crux-aarch64-unknown-linux-gnu
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: crux.exe
            asset: crux-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # A tag run cannot share a cache with a later tag, so do not save one.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: false
      - name: Install Linux ARM64 cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify binary runs on the supported platform
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/$BINARY"
          if [[ "$TARGET" == "aarch64-unknown-linux-gnu" ]]; then
            actual="$(qemu-aarch64 -L /usr/aarch64-linux-gnu "$binary" --version)"
          else
            actual="$("$binary" --version)"
          fi
          expected="crux ${GITHUB_REF_NAME#v}"
          [[ "$actual" == "$expected" ]] || {
            echo "Expected $expected, got $actual"
            exit 1
          }
          echo "$actual runs successfully on $TARGET"
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The release step reads the release notes from the repository.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: crux-*
          merge-multiple: true
      # Each line has the sha256sum format: <hex hash>, two spaces, <file name>.
      # The `crux self-update` command expects an asset named exactly SHA256SUMS.
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum crux-* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          body_path: doc/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            dist/crux-*
            dist/SHA256SUMS
