[package]
name = "crux"
version = "0.12.0"
edition = "2021"
rust-version = "1.85"
description = "Token-efficient code navigation for AI coding agents — SCIP-backed MCP server"
license = "MIT"
repository = "https://github.com/pedr0v/crux"

[dependencies]
anyhow = "1.0.104"
protobuf = "3.7.2"
scip = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
