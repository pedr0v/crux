[package]
name = "crux"
version = "0.7.0"
edition = "2021"
description = "Token-efficient code navigation for AI coding agents — SCIP-backed MCP server"
license = "MIT"
repository = "https://github.com/pedr0v/crux"

[dependencies]
anyhow = "1.0.104"
protobuf = "3.7.2"
scip = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
